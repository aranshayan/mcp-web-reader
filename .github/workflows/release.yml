name: Release

# Publishes to npm when a version tag (v*) is pushed, using npm trusted
# publishing (OIDC). No npm token is stored anywhere: npm checks that the run
# comes from this repository and this workflow file, and adds provenance.
# One-time setup on npmjs.com: package Settings > Trusted Publisher > GitHub
# Actions, with this repository and the workflow file name release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@12.2.3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
